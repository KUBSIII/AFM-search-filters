[tool.poetry]
name = "afm-search-filters"
version = "0.1.0"
description = "Internal Transfermarkt player filter service"
authors = ["KUBSIII"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.0"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
pydantic = "^2.11.0"
pydantic-settings = "^2.10.0"
sqlalchemy = "^2.0.40"
alembic = "^1.16.0"
httpx = "^0.28.0"
beautifulsoup4 = "^4.13.0"
lxml = "^5.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

