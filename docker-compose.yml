services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afm-search-api
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_URL: sqlite+pysqlite:///./data/afm_search.db
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
      - afm_data:/app/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  afm_data:
